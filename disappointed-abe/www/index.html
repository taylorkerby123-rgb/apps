<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disappointed Abe</title>
<style>
/* Layout: one-screen phone app. Wood-type broadside header, portrait stage, one big button. Single dark look by choice. */
:root {
  --ink: #15121c;
  --paper: #f6efe1;
  --muted: #b9adc4;
  --pop: #ff2e88;
  --pop-deep: #c4105f;
  --gold: #ffc531;
  --display: "Alfa Slab One", "Rockwell", "Georgia", serif;
  --body: "Work Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
header { text-align: center; display: grid; gap: 2px; }
.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
}
h1 {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(26px, 8vw, 40px); line-height: 1; letter-spacing: .01em;
  text-wrap: balance;
}
h1 .mood { color: var(--gold); transition: color .4s; }
.sad h1 .mood { color: var(--pop); }

.stage {
  flex: 1 1 auto; min-height: 0; width: 100%;
  display: flex; align-items: center; justify-content: center;
}
.frame {
  position: relative;
  aspect-ratio: 2 / 3;
  height: 100%; max-height: 100%; max-width: calc(100% - 8px);
  border: 4px solid var(--paper);
  box-shadow: 8px 8px 0 var(--pop);
  background: #2a2333;
  transition: box-shadow .4s;
}
.sad .frame { box-shadow: 8px 8px 0 #4b6bff; }
.frame canvas, .frame img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover;
}
.frame img.sadimg { opacity: 0; transition: opacity .6s; }
.sad .frame img.sadimg { opacity: 1; }
.frame.shake { animation: shake .55s ease-out; }
@keyframes shake {
  0%,100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-7px) rotate(-1.2deg); }
  40% { transform: translateX(6px) rotate(1deg); }
  60% { transform: translateX(-4px) rotate(-.6deg); }
  80% { transform: translateX(2px) rotate(.3deg); }
}

.verdict {
  position: absolute; left: 50%; bottom: 7%;
  transform: translateX(-50%) rotate(-6deg) scale(.6);
  opacity: 0;
  background: var(--paper); color: var(--ink);
  font-family: var(--display); font-size: clamp(15px, 4.6vw, 22px); line-height: 1.05;
  text-align: center; text-transform: uppercase;
  padding: 8px 14px; border: 3px solid var(--ink);
  box-shadow: 5px 5px 0 var(--pop);
  width: max-content; max-width: 86%;
  pointer-events: none;
  transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);
}
.sad .verdict.show { opacity: 1; transform: translateX(-50%) rotate(-6deg) scale(1); }

.controls { width: 100%; max-width: 420px; display: grid; gap: 8px; }
button {
  font: inherit; cursor: pointer; border: 3px solid var(--paper);
  border-radius: 0; touch-action: manipulation;
}
.big {
  font-family: var(--display); font-size: clamp(20px, 6vw, 26px); text-transform: uppercase;
  padding: 16px 12px; color: var(--paper); background: var(--pop);
  box-shadow: 5px 5px 0 var(--paper);
  transition: transform .08s, box-shadow .08s, background .3s;
}
.big:active { transform: translate(4px,4px); box-shadow: 1px 1px 0 var(--paper); }
.sad .big { background: #3550e0; }
.big:focus-visible, .small:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0; min-height: 1.3em; }

@media (prefers-reduced-motion: reduce) {
  .frame.shake { animation: none; }
  .verdict { transition: opacity .2s; }
}
@media (min-aspect-ratio: 1/1) and (max-height: 520px) {
  header .eyebrow { display: none; }
}
</style>

<style>
@font-face{font-family:'Alfa Slab One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/alfa-slab-one-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Work Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/work-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Work Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/work-sans-latin-700-normal.woff2) format('woff2')}
html.in-app body{box-sizing:border-box;padding-top:calc(env(safe-area-inset-top) + var(--ad-top,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
html.in-app input,html.in-app textarea{-webkit-user-select:text;user-select:text}
</style>

<script>
(() => {
  const app = document.getElementById('app');
  const btn = document.getElementById('btn');
  const mood = document.getElementById('mood');
  const verdict = document.getElementById('verdict');
  const hint = document.getElementById('hint');
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('gl');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const lines = [
    "Four score and seven years for this?",
    "I split rails for this?",
    "A house divided cannot stand. Neither can this.",
    "I'm not mad. I'm disappointed.",
    "Honest Abe expected better.",
    "With malice toward none. Except you.",
    "My hat is too tall to hide my shame.",
    "Of the people, by the people, not like this.",
    "I've seen Gettysburg. This is worse.",
    "Emancipate yourself from this choice."
  ];
  let lastLine = -1;
  function pickLine() {
    let i;
    do { i = Math.floor(Math.random() * lines.length); } while (i === lastLine && lines.length > 1);
    lastLine = i; return lines[i];
  }

  // Face warp control points, in source-image pixels (1280 x 1920):
  // [x, y, dx, dy, radius]. Mouth corners drop, brows knit down, lids droop.
  const PTS = [
    [490,1085,-6,70,70],[810,1070,6,70,70],[650,1078,0,-14,60],[650,1135,0,-18,55],
    [585,675,22,40,70],[695,680,-22,40,70],[400,650,0,-6,80],[880,650,0,-6,80],
    [460,712,0,22,48],[780,702,0,22,48]
  ];

  let gl = null, uT = null, t = 0, target = 0, raf = 0, last = 0;

  function initGL(img) {
    try {
      gl = canvas.getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: false });
    } catch (e) { gl = null; }
    if (!gl) return false;
    const vs = `attribute vec2 p; varying vec2 uv;
      void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
    const fs = `precision highp float;
      varying vec2 uv; uniform sampler2D tex; uniform float t;
      uniform vec4 pts[${PTS.length}]; uniform float rad[${PTS.length}];
      void main(){
        vec2 P = uv * vec2(1280.,1920.);
        vec2 d = vec2(0.);
        for (int i=0;i<${PTS.length};i++){
          vec2 c = pts[i].xy; float r = rad[i];
          vec2 q = P - c;
          d += exp(-dot(q,q)/(2.*r*r)) * pts[i].zw;
        }
        vec2 S = (P - t*d) / vec2(1280.,1920.);
        vec3 col = texture2D(tex, clamp(S, 0., 1.)).rgb;
        float g = dot(col, vec3(.299,.587,.114));
        col = mix(col, vec3(g)*vec3(.92,.97,1.12), .22*t);
        vec2 v = uv - .5; col *= 1. - .45*t*smoothstep(.25,.75,length(v*vec2(1.,.8)));
        gl_FragColor = vec4(col,1.);
      }`;
    function sh(type, src) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    try {
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('link');
      gl.useProgram(pr);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      const flat = [], rads = [];
      PTS.forEach(p => { flat.push(p[0], p[1], p[2], p[3]); rads.push(p[4]); });
      gl.uniform4fv(gl.getUniformLocation(pr, 'pts'), new Float32Array(flat));
      gl.uniform1fv(gl.getUniformLocation(pr, 'rad'), new Float32Array(rads));
      uT = gl.getUniformLocation(pr, 't');
    } catch (e) { gl = null; return false; }
    return true;
  }

  function resize() {
    if (!gl) return;
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    draw();
  }
  function draw() {
    if (!gl) return;
    // ease with a little overshoot on the way in
    const e = target ? easeOutBack(t) : easeInOut(t);
    gl.uniform1f(uT, e);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  const easeOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
  const easeInOut = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;

  function tick(now) {
    const dt = Math.min(64, now - (last || now)); last = now;
    const dur = reduce ? 1 : (target ? 650 : 450);
    t += (target ? 1 : -1) * dt / dur;
    t = Math.max(0, Math.min(1, t));
    draw();
    if ((target && t < 1) || (!target && t > 0)) raf = requestAnimationFrame(tick);
    else { raf = 0; last = 0; }
  }
  function animate() {
    if (!gl) return;
    if (reduce) { t = target; draw(); return; }
    if (!raf) { last = 0; raf = requestAnimationFrame(tick); }
  }

  let sad = false, verdictTimer = 0;
  function setSad(on) {
    sad = on; target = on ? 1 : 0;
    app.classList.toggle('sad', on);
    mood.textContent = on ? 'disappointed' : 'proud';
    btn.textContent = on ? 'Restore his faith' : 'Disappoint Abe';
    hint.textContent = on ? 'Tap the portrait for another verdict.' : 'Point the screen at whoever deserves it.';
    clearTimeout(verdictTimer);
    verdict.classList.remove('show');
    if (on) {
      verdict.textContent = pickLine();
      verdictTimer = setTimeout(() => verdict.classList.add('show'), reduce ? 0 : 520);
      if (!reduce) {
        frame.classList.remove('shake'); void frame.offsetWidth;
        setTimeout(() => frame.classList.add('shake'), 380);
      }
      try { navigator.vibrate && navigator.vibrate([30, 60, 90]); } catch (e) {}
    }
    animate();
  }

  btn.addEventListener('click', () => setSad(!sad));
  frame.addEventListener('click', () => {
    if (!sad) { setSad(true); return; }
    verdict.classList.remove('show');
    verdict.textContent = pickLine();
    void verdict.offsetWidth;
    verdict.classList.add('show');
  });
  frame.addEventListener('animationend', () => frame.classList.remove('shake'));

  const img = document.getElementById('baseimg');
  function boot() {
    if (initGL(img)) {
      canvas.hidden = false;
      document.getElementById('sadimg').hidden = true;
      resize();
      new ResizeObserver(resize).observe(canvas);
    }
  }
  if (img.complete && img.naturalWidth) boot(); else img.addEventListener('load', boot, { once: true });
})();
</script>
<script src="ads.bundle.js"></script>
</body>
</html>
