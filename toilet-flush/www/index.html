<title>Toilet Flush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: standing over the toilet, looking down. Tank at the top, seat and bowl fill the screen,
   tile floor all around. Tap the toilet to flush.
   Color tokens: wall, wall highlight, grout, baseboard, floor, floor highlight, floor grout, hint ring.
   Type: none, the scene has no text. */
:root {
  --wall: #b9cfd6;
  --wall-hi: #c6d9df;
  --grout: #9db8c1;
  --base: #e6eef1;
  --floor: #c3ced4;
  --floor-hi: #d0d9de;
  --floor-grout: #9eadb6;
  --hint: #176b94;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #22343d;
    --wall-hi: #2a3f49;
    --grout: #19262d;
    --base: #33495a;
    --floor: #243139;
    --floor-hi: #2c3b44;
    --floor-grout: #141d22;
    --hint: #8ad7f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #22343d;
  --wall-hi: #2a3f49;
  --grout: #19262d;
  --base: #33495a;
  --floor: #243139;
  --floor-hi: #2c3b44;
  --floor-grout: #141d22;
  --hint: #8ad7f2;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--floor);
  color: var(--hint);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#toilet {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  overflow: visible;
  cursor: pointer;
  outline: none;
}
#toilet:focus-visible .hintring { opacity: 1; }

.lever { transform-origin: 100px 166px; }
.hintring { opacity: 0; transform-origin: 100px 166px; }
.pool { transform-origin: 200px 548px; }
.ripple { transform-origin: 200px 500px; opacity: 0; }
.vortexSpin { transform-origin: 0 0; }
.vortexWrap, .jets, .wet { opacity: 0; }

/* idle */
.ripple { animation: ripple 7s ease-out infinite; }
.ripple.r2 { animation-delay: .4s; }
.ripple.r3 { animation-delay: .8s; }
@keyframes ripple {
  0% { transform: scale(.15); opacity: .9; }
  14% { opacity: .55; }
  22%, 100% { transform: scale(1.4); opacity: 0; }
}
.hint .hintring { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse {
  0% { transform: scale(.7); opacity: .9; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* flush, 10.2 seconds in total */
.flushing .lever { animation: press 1.1s ease-in-out both; }
@keyframes press {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(17deg); }
  65% { transform: rotate(17deg); }
  100% { transform: rotate(0deg); }
}
.flushing .tank { animation: shake .09s linear .5s 28; }
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(.5px,.3px); }
  50% { transform: translate(-.4px,-.2px); }
  75% { transform: translate(.3px,-.3px); }
}
.flushing .pool { animation: level 10.2s linear both; }
@keyframes level {
  0% { transform: scale(1); }
  6% { transform: scale(1.05); }
  14% { transform: scale(1.02); }
  36% { transform: scale(.8,.75); }
  50% { transform: scale(.45,.4); }
  58% { transform: scale(.3,.26); }
  64% { transform: scale(.32,.28); }
  88% { transform: scale(.85); }
  96% { transform: scale(1.01); }
  100% { transform: scale(1); }
}
.flushing .vortexWrap { animation: swirlOp 10.2s linear both; }
@keyframes swirlOp {
  0%,4% { opacity: 0; }
  10% { opacity: 1; }
  44% { opacity: 1; }
  56%,100% { opacity: 0; }
}
.flushing .vortexSpin { animation: rot 1.15s linear infinite; }
@keyframes rot { to { transform: rotate(-360deg); } }
.flushing .arm { animation: flow .7s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -100; } }
.flushing .jets { animation: jetsOp 10.2s linear both; }
.flushing .jets rect { animation: flow2 .45s linear infinite; }
@keyframes jetsOp {
  0%,3% { opacity: 0; }
  7% { opacity: .95; }
  40% { opacity: .85; }
  50%,100% { opacity: 0; }
}
@keyframes flow2 { to { stroke-dashoffset: -24; } }
.flushing .wet { animation: wetOp 10.2s linear both; }
@keyframes wetOp {
  0% { opacity: 0; }
  12% { opacity: .22; }
  50% { opacity: .2; }
  72%,100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .flushing .tank, .ripple { animation: none; }
  .hint .hintring { animation: none; opacity: .8; transform: scale(1.2); }
}
</style>

<script>
(function () {
  var svg = document.getElementById('toilet');
  var ctx = null, master = null, noiseBuf = null, busy = false;

  // spiral arms of the flushing water, drawn in a circle and squashed by the group transform
  (function buildArms() {
    var NS = 'http://www.w3.org/2000/svg';
    var host = document.getElementById('arms');
    for (var k = 0; k < 4; k++) {
      var pts = [], steps = 56, turns = 1.2;
      for (var i = 0; i <= steps; i++) {
        var f = i / steps, r = 104 - 86 * f, a = k * Math.PI / 2 + f * turns * 2 * Math.PI;
        pts.push((r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1));
      }
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M' + pts.join(' L'));
      p.setAttribute('class', 'arm');
      p.setAttribute('stroke-width', k % 2 ? '5' : '7');
      p.setAttribute('stroke-opacity', k % 2 ? '0.6' : '0.8');
      p.setAttribute('stroke-dasharray', '58 42');
      host.appendChild(p);
    }
  })();

  function setupAudio() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      var comp = ctx.createDynamicsCompressor();
      master = ctx.createGain();
      master.gain.value = 0.85;
      master.connect(comp);
      comp.connect(ctx.destination);
      var len = ctx.sampleRate * 3;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      var b0 = 0, b1 = 0, b2 = 0;
      for (var i = 0; i < len; i++) {
        var w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099046;
        b1 = 0.963 * b1 + w * 0.2965164;
        b2 = 0.57 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.11;
      }
    } catch (e) { ctx = null; }
  }

  function env(param, t, pts) {
    param.setValueAtTime(pts[0][1], t + pts[0][0]);
    for (var i = 1; i < pts.length; i++) param.linearRampToValueAtTime(pts[i][1], t + pts[i][0]);
  }
  function noise(t, dur) {
    var s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    s.start(t, Math.random() * 2);
    s.stop(t + dur);
    return s;
  }
  function filt(type, freq, q) {
    var f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq;
    if (q) f.Q.value = q;
    return f;
  }
  function chain(src, nodes, gainNode) {
    var prev = src;
    nodes.forEach(function (n) { prev.connect(n); prev = n; });
    prev.connect(gainNode);
    gainNode.connect(master);
  }

  function clickSound(t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(55, t + 0.14);
    env(g.gain, t, [[0, 0], [0.005, 0.55], [0.16, 0]]);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
    var n = noise(t, 0.06), g2 = ctx.createGain();
    env(g2.gain, t, [[0, 0], [0.003, 1.6], [0.05, 0]]);
    chain(n, [filt('highpass', 1800)], g2);
    var n3 = noise(t + 0.02, 0.2), g3 = ctx.createGain();
    env(g3.gain, t + 0.02, [[0, 0], [0.03, 0.8], [0.2, 0]]);
    chain(n3, [filt('bandpass', 700, 1.5)], g3);
  }

  function glug(t, f) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * (Math.random() < 0.5 ? 1.8 : 0.55), t + 0.14);
    env(g.gain, t, [[0, 0], [0.02, 0.26], [0.15, 0]]);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
  }

  function flushSound(T) {
    // main rush
    var n1 = noise(T, 7), bp = filt('bandpass', 450, 0.7), g1 = ctx.createGain();
    bp.frequency.setValueAtTime(450, T);
    bp.frequency.linearRampToValueAtTime(1100, T + 1.2);
    bp.frequency.linearRampToValueAtTime(800, T + 4.5);
    bp.frequency.linearRampToValueAtTime(500, T + 6.5);
    env(g1.gain, T, [[0, 0], [0.35, 1.0], [1.2, 1.25], [4, 1.0], [5.2, 0.4], [6.4, 0]]);
    chain(n1, [bp], g1);
    var lfo = ctx.createOscillator(), lg = ctx.createGain(), lg2 = ctx.createGain();
    lfo.frequency.value = 2.3;
    lg.gain.value = 0.22; lg2.gain.value = 140;
    lfo.connect(lg); lg.connect(g1.gain);
    lfo.connect(lg2); lg2.connect(bp.frequency);
    lfo.start(T); lfo.stop(T + 6.5);
    // low rumble
    var n2 = noise(T, 7), g2 = ctx.createGain();
    env(g2.gain, T, [[0, 0], [0.3, 1.7], [3, 1.3], [5.5, 0.45], [6.2, 0]]);
    chain(n2, [filt('lowpass', 260, 0.7)], g2);
    // airy hiss
    var n3 = noise(T, 6), g3 = ctx.createGain();
    env(g3.gain, T, [[0, 0], [0.5, 0.25], [3.5, 0.2], [5, 0]]);
    chain(n3, [filt('highpass', 3200)], g3);
    // gurgles as the bowl empties
    for (var k = 0; k < 10; k++) {
      glug(T + 4.1 + k * 0.23 + Math.random() * 0.1, 150 + Math.random() * 190);
    }
    // final slurp
    var n4 = noise(T + 5.2, 1.2), g4 = ctx.createGain(), bp4 = filt('bandpass', 2200, 5);
    bp4.frequency.setValueAtTime(2200, T + 5.2);
    bp4.frequency.exponentialRampToValueAtTime(380, T + 6.1);
    env(g4.gain, T + 5.2, [[0, 0], [0.1, 0.5], [0.8, 0.35], [1, 0]]);
    chain(n4, [bp4], g4);
    // refill trickle
    var R = T + 5.9;
    var n5 = noise(R, 4.2), g5 = ctx.createGain();
    env(g5.gain, R, [[0, 0], [0.6, 0.55], [3.2, 0.5], [3.9, 0]]);
    chain(n5, [filt('bandpass', 3000, 0.9)], g5);
    var tl = ctx.createOscillator(), tg = ctx.createGain();
    tl.frequency.value = 9; tg.gain.value = 0.12;
    tl.connect(tg); tg.connect(g5.gain);
    tl.start(R); tl.stop(R + 4.2);
    var n6 = noise(R, 4.2), g6 = ctx.createGain();
    env(g6.gain, R, [[0, 0], [0.6, 0.14], [3.2, 0.12], [3.9, 0]]);
    chain(n6, [filt('highpass', 5500)], g6);
    // fill valve shuts off
    var c = T + 9.85, o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, c);
    o.frequency.exponentialRampToValueAtTime(52, c + 0.16);
    env(og.gain, c, [[0, 0], [0.005, 0.35], [0.18, 0]]);
    o.connect(og); og.connect(master);
    o.start(c); o.stop(c + 0.25);
  }

  function flush() {
    if (busy) return;
    busy = true;
    svg.classList.remove('hint');
    svg.classList.add('flushing');
    setupAudio();
    if (ctx) {
      var go = function () {
        try {
          var t = ctx.currentTime + 0.03;
          clickSound(t);
          flushSound(t + 0.35);
        } catch (e) {}
      };
      if (ctx.state === 'running') go();
      else ctx.resume().then(go, go);
    }
    setTimeout(function () {
      svg.classList.remove('flushing');
      busy = false;
    }, 10300);
  }

  svg.addEventListener('click', flush);
  svg.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flush(); }
  });
})();
</script>
