/* App-only adjustments: active when running inside the iOS/Android app */
html.in-app .ad,html.in-app [data-ad-slot]{display:none!important}
html.in-app body{padding-top:calc(env(safe-area-inset-top) + var(--ad-top,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
html.in-app .topbar{top:calc(env(safe-area-inset-top) + var(--ad-top,0px))}
html.in-app input,html.in-app textarea{-webkit-user-select:text;user-select:text}

<style>
:root{
  --bg:#0b0b0c; --panel:#121214; --panel2:#17171a; --line:#25252a; --line2:#34343a;
  --ink:#ece7dd; --ink2:#c9c3b8; --mute:#87827a; --dim:#5d5a55;
  --brass:#b89a62; --brass2:#d8bd86; --brassbg:rgba(184,154,98,.10);
  --good:#8fb08a; --bad:#c0705f;
  --sqL:#d4ccbb; --sqD:#857b6b;
  --serif:'Cormorant Garamond', 'Times New Roman', serif;
  --sans:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:4px;
  --nav:232px;
  --tab:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--nav);border-right:1px solid var(--line);padding:32px 22px;display:flex;flex-direction:column;gap:36px;background:var(--bg);z-index:5}
.mark{display:flex;align-items:center;gap:12px}
.mark .appicon{width:34px;height:34px;display:block}
.mark .word{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.32em}
.mark .sub{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-top:-4px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist a{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:var(--r);color:var(--mute);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:color .2s,background .2s}
.navlist a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4}
.navlist a:hover{color:var(--ink)}
.navlist a.on{color:var(--ink);background:var(--panel2)}
.navlist a.on svg{stroke:var(--brass)}
.side .chip{margin-top:auto;border-top:1px solid var(--line);padding-top:20px}
.side .chip .lab{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.side .chip .val{font-family:var(--serif);font-size:38px;font-weight:500;line-height:1.1}
.side .chip .tier{font-size:12px;color:var(--brass);letter-spacing:.14em;text-transform:uppercase}
.sync{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:10px}

main{flex:1;margin-left:var(--nav);min-width:0;padding:28px 44px 60px}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:none}
.tabbar{display:none}

/* ---------- Ads ---------- */
.ad{border:1px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.012) 10px 20px),var(--panel);border-radius:var(--r);display:flex;align-items:center;justify-content:center;position:relative;color:var(--dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.ad::before{content:'Advertisement';position:absolute;top:6px;left:9px;font-size:9px;letter-spacing:.2em;color:var(--dim)}
.ad .dim{opacity:.8}
.ad-banner{height:90px;max-width:728px;margin:0 auto 32px}
.ad-rect{width:100%;max-width:300px;height:250px;margin:0 auto}
.ad-native{height:auto;justify-content:flex-start;padding:18px 20px;gap:16px;text-transform:none;letter-spacing:0;font-size:13px}
.ad-native::before{content:'Sponsored'}
.ad-native .thumb{width:44px;height:44px;border:1px solid var(--line2);border-radius:var(--r);flex:none}
.ad-native .t1{color:var(--ink2);font-size:14px;margin-top:8px}
.ad-native .t2{color:var(--dim);font-size:12px}

/* ---------- Type ---------- */
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:500}
.eyebrow.brass{color:var(--brass)}
h1.display{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.05;letter-spacing:.01em}
h2.title{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15}
h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2}
p.lead{color:var(--ink2);font-size:16px;max-width:60ch}
.muted{color:var(--mute)}
.rule{height:1px;background:var(--line);margin:28px 0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:var(--r);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;border:1px solid var(--line2);color:var(--ink);transition:all .2s}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--ink);color:#0b0b0c;border-color:var(--ink)}
.btn.primary:hover{background:#fff}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#0b0b0c}
.btn.brass:hover{background:var(--brass2)}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{height:34px;padding:0 14px;font-size:11px}
.btn:disabled{opacity:.35;pointer-events:none}
.iconbtn{width:40px;height:40px;border:1px solid var(--line2);border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4}
.iconbtn:hover{color:var(--ink);border-color:var(--mute)}

/* ---------- Cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat .lab{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.stat .val{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.15;margin-top:4px}
.stat .val small{font-family:var(--sans);font-size:12px;color:var(--mute);margin-left:4px;letter-spacing:.05em}
.bar{height:2px;background:var(--line2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .8s cubic-bezier(.2,.7,.2,1)}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-bottom:20px}
.hero .score{padding:34px 34px 30px;position:relative;overflow:hidden}
.hero .score .big{font-family:var(--serif);font-size:96px;font-weight:500;line-height:1;margin:14px 0 6px;letter-spacing:-.01em}
.hero .score .delta{font-size:13px;color:var(--good);letter-spacing:.06em}
.hero .score .delta.neg{color:var(--bad)}
.hero .score .tierline{display:flex;justify-content:space-between;margin:26px 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.hero .score .tierline b{color:var(--brass);font-weight:600}
.hero .score .ghost{position:absolute;right:-30px;bottom:-40px;width:260px;height:260px;opacity:.04}
.hero .score .ghost svg{width:100%;height:100%;--pd:transparent;fill:var(--ink);stroke:none}
.next{display:flex;flex-direction:column}
.next .num-roman{font-family:var(--serif);color:var(--brass);font-size:15px;letter-spacing:.2em}
.next h3{font-size:28px;margin:10px 0 8px}
.next p{color:var(--ink2);margin-bottom:22px}
.next .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.spark{height:56px;width:100%;margin-top:18px}

/* ---------- Lessons list ---------- */
.chapter{margin-top:42px}
.chapter-head{display:flex;align-items:baseline;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chapter-head .rn{font-family:var(--serif);color:var(--brass);font-size:22px;width:28px}
.lrow{display:grid;grid-template-columns:56px 1fr 120px 24px;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);transition:background .2s}
.lrow:hover{background:linear-gradient(90deg,transparent,var(--panel) 30%,var(--panel) 70%,transparent)}
.lrow .ico{width:48px;height:48px;border:1px solid var(--line2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lrow .ico svg{width:30px;height:30px}
.lrow .nm{font-family:var(--serif);font-size:22px;font-weight:600}
.lrow .sm{font-size:13px;color:var(--mute)}
.lrow .pct{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;text-align:right}
.lrow .pct.done{color:var(--brass)}
.lrow .chev{color:var(--dim)}
.list-ad{margin-top:28px}

/* ---------- Lesson detail ---------- */
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:26px}
.back:hover{color:var(--ink)}
.lesson-grid{display:grid;grid-template-columns:1fr minmax(320px,440px);grid-template-areas:'text board' 'prac board';column-gap:44px;align-items:start}.lesson-text{grid-area:text}.lesson-board{grid-area:board;position:sticky;top:24px}.lesson-prac{grid-area:prac}
.lesson-text p{color:var(--ink2);margin-bottom:16px;font-size:15.5px}
.keys{list-style:none;margin:24px 0 8px;border-top:1px solid var(--line)}
.keys li{padding:12px 0 12px 28px;border-bottom:1px solid var(--line);position:relative;font-size:14px}
.keys li::before{content:'';position:absolute;left:4px;top:20px;width:8px;height:8px;border:1px solid var(--brass);transform:rotate(45deg)}
.mastery-box{margin-top:30px}
.mrow{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;color:var(--ink2);margin:14px 0 8px}
.drill-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drill-dots{display:flex;gap:6px}
.drill-dots i{width:22px;height:2px;background:var(--line2)}
.drill-dots i.on{background:var(--ink)}
.drill-dots i.ok{background:var(--brass)}
.prompt{font-family:var(--serif);font-size:20px;line-height:1.3;margin:16px 0 6px;min-height:52px}
.feedback{font-size:13.5px;min-height:44px;color:var(--ink2)}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
.drill-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.practice{margin-top:34px;border-color:var(--line2);background:linear-gradient(160deg,var(--brassbg),transparent 60%),var(--panel)}

/* ---------- Board ---------- */
.board-frame{position:relative;padding:10px;border:1px solid var(--line2);border-radius:2px;background:#0f0f11}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1/1;width:100%;user-select:none;touch-action:manipulation;position:relative}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.l{background:var(--sqL)} .sq.d{background:var(--sqD)}
.sq .pc{width:88%;height:88%;position:relative;z-index:2;transition:transform .12s;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.sq.sel .pc{transform:translateY(-2px)}
.pc.pw{fill:#f6f2ea;stroke:#151517;--pd:#151517}
.pc.pb{fill:#1c1c1f;stroke:#0a0a0b;--pd:#d4ccbb}
.pc{stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.sq.last::before{content:'';position:absolute;inset:0;background:rgba(184,154,98,.42)}
.sq.sel::before{content:'';position:absolute;inset:0;background:rgba(184,154,98,.62)}
.sq.chk::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(192,90,70,.85) 0,rgba(192,90,70,.35) 45%,transparent 72%)}
.sq.dot::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(15,15,17,.32);z-index:3}
.sq.cap::after{content:'';position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(15,15,17,.32);z-index:3}
.sq.hint::before{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--brass);animation:pulse 1.4s ease-in-out infinite}
.sq.hint2::before{content:'';position:absolute;inset:0;background:rgba(143,176,138,.5)}
@keyframes pulse{50%{box-shadow:inset 0 0 0 6px rgba(184,154,98,.5)}}
.sq .cr{position:absolute;font-size:9.5px;font-weight:600;z-index:1;letter-spacing:0}
.sq .cr.rk{top:2px;left:3px} .sq .cr.fl{bottom:1px;right:4px}
.sq.l .cr{color:var(--sqD)} .sq.d .cr{color:var(--sqL)}

/* ---------- Play ---------- */
.play-grid{display:grid;grid-template-columns:minmax(0,600px) minmax(280px,340px);gap:32px;justify-content:center;align-items:start}
.player{display:flex;align-items:center;justify-content:space-between;padding:10px 2px}
.player .who{display:flex;align-items:center;gap:12px}
.player .av{width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.player .av svg{width:28px;height:28px}
.player .nm{font-size:14px;font-weight:500}
.player .rt{font-size:12px;color:var(--mute)}
.player .capt{display:flex;gap:0;height:18px;align-items:center}
.player .capt svg{width:16px;height:16px;margin-left:-4px}
.thinking{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);display:none}
.thinking.on{display:block}
.thinking i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--brass);margin-left:3px;animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.controls{display:flex;gap:10px;margin-top:16px;justify-content:space-between;flex-wrap:wrap}
.controls .grp{display:flex;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel+.panel{margin-top:16px}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-b{padding:16px 20px}
.focus-name{font-family:var(--serif);font-size:20px;font-weight:600}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.checks span{font-size:11px;letter-spacing:.08em;padding:5px 10px;border:1px solid var(--line2);border-radius:20px;color:var(--mute)}
.checks span.ok{border-color:var(--brass);color:var(--brass)}
.opp{margin-top:14px;padding:14px;border:1px solid var(--brass);border-radius:var(--r);background:var(--brassbg);display:none}
.opp.on{display:block;animation:fadein .4s}
.opp .t{font-size:13.5px;color:var(--ink)}
.opp .a{display:flex;gap:8px;margin-top:10px}
.log{list-style:none;max-height:210px;overflow:auto;margin-top:6px}
.log li{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink2);display:flex;gap:10px;animation:fadein .4s}
.log li:last-child{border-bottom:0}
.log li .tg{flex:none;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding-top:3px;width:62px;color:var(--mute)}
.log li.good .tg{color:var(--brass)} .log li.warn .tg{color:var(--bad)} .log li.miss .tg{color:#a89a7c}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.toggle .sw{width:30px;height:16px;border-radius:10px;border:1px solid var(--line2);position:relative;transition:.2s}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--mute);transition:.2s}
.toggle.on .sw{border-color:var(--brass)}
.toggle.on .sw::after{left:16px;background:var(--brass)}
.moves{display:grid;grid-template-columns:34px 1fr 1fr;font-size:13px;max-height:170px;overflow:auto;font-variant-numeric:tabular-nums}
.moves span{padding:4px 6px}
.moves .n{color:var(--dim)}
.moves .cur{color:var(--brass)}
.side-ad{margin-top:16px}

/* setup */
.setup{max-width:760px;margin:0 auto}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 30px}
.lvl{border:1px solid var(--line2);border-radius:var(--r);padding:18px 16px;text-align:left;transition:.2s;background:var(--panel)}
.lvl:hover{border-color:var(--mute)}
.lvl.on{border-color:var(--brass);background:var(--brassbg)}
.lvl .rn{font-family:var(--serif);color:var(--brass);font-size:15px;letter-spacing:.15em}
.lvl .nm{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:6px}
.lvl .rt{font-size:12px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin:14px 0 30px}
.seg button{padding:11px 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#0b0b0c}
select.sel{appearance:none;background:var(--panel);border:1px solid var(--line2);color:var(--ink);height:44px;border-radius:var(--r);padding:0 40px 0 14px;font:inherit;font-size:14px;margin:14px 0 30px;width:100%;max-width:380px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 19px,calc(100% - 15px) 19px;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- Progress ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:10px;fill:var(--mute);letter-spacing:.08em}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px}
.ladder .t{text-align:center;padding:14px 4px 12px;border:1px solid var(--line);border-radius:var(--r);opacity:.45}
.ladder .t.got{opacity:1}
.ladder .t.cur{border-color:var(--brass);background:var(--brassbg);opacity:1}
.ladder .t svg{width:42px;height:42px}
.ladder .t .n{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.ladder .t .r{font-size:11px;color:var(--mute)}
table.tt{width:100%;border-collapse:collapse;font-size:13.5px}
table.tt th{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:500;text-align:left;padding:0 0 10px;border-bottom:1px solid var(--line)}
table.tt td{padding:13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.tt td.r,table.tt th.r{text-align:right}
table.tt .vis{width:110px}
.res{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-size:11px;font-weight:600;border:1px solid var(--line2)}
.res.W{border-color:var(--brass);color:var(--brass)} .res.L{color:var(--bad)} .res.D{color:var(--mute)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.empty{color:var(--mute);font-size:14px;padding:18px 0}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(5,5,6,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex;animation:fadein .3s}
.dialog{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:34px}
.dialog .result{font-family:var(--serif);font-size:48px;font-weight:500;line-height:1}
.dialog .rchange{display:flex;align-items:baseline;gap:14px;margin:22px 0 4px}
.dialog .rchange .big{font-family:var(--serif);font-size:56px;line-height:1}
.dialog .rchange .d{font-size:15px}
.dialog .tl{list-style:none;margin:16px 0}
.dialog .tl li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dialog .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.promo{display:flex;gap:10px;justify-content:center;margin-top:18px}
.promo button{width:72px;height:72px;border:1px solid var(--line2);border-radius:var(--r);background:var(--sqL)}
.promo button:hover{border-color:var(--brass)}
.promo svg{width:56px;height:56px}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:var(--ink);color:#0b0b0c;padding:11px 20px;border-radius:var(--r);font-size:12.5px;letter-spacing:.06em;opacity:0;transition:.35s;z-index:60;pointer-events:none;font-weight:500;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:#7a5f2e}

.view{display:none}
.view.on{display:block;animation:fadein .35s}
.section-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .play-grid{grid-template-columns:minmax(0,560px);}
  .play-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .play-side .panel+.panel{margin-top:0}
  .side-ad{grid-column:1/-1;margin-top:0}
}
@media (max-width:900px){
  :root{--nav:0px}
  .side{display:none}
  main{margin-left:0;padding:0 16px calc(var(--tab) + 28px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;justify-content:space-between;height:60px;margin:0 -16px 16px;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10}
  .topbar .mark .word{font-size:18px}
  .topbar .mark .appicon{width:28px;height:28px}
  .topbar .rc{text-align:right;line-height:1.1}
  .topbar .rc .v{font-family:var(--serif);font-size:24px;font-weight:500}
  .topbar .rc .t{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(11,11,12,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .tabbar a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on svg{stroke:var(--brass)}
  .ad-banner{height:50px;max-width:320px;margin-bottom:22px}
  .ad-banner::before{top:3px;font-size:8px}
  .hero{grid-template-columns:1fr}
  .hero .score{padding:26px 24px}
  .hero .score .big{font-size:80px}
  .card{padding:22px}
  h1.display{font-size:34px}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}

<script id="engine-src">
/* TEMPO chess engine: rules, search, and technique detection. Runs in page and in a Worker. */
var ENG = (function () {
  var FILES = 'abcdefgh';
  var VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
  var TV = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
  var KN = [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]];
  var DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  var ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  var ALL8 = DIAG.concat(ORTH);
  var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

  function col(p) { return p ? (p === p.toUpperCase() ? 'w' : 'b') : null; }
  function typ(p) { return p ? p.toLowerCase() : null; }
  function opp(c) { return c === 'w' ? 'b' : 'w'; }
  function on(r, f) { return r >= 0 && r < 8 && f >= 0 && f < 8; }
  function sqName(i) { return FILES[i & 7] + (8 - (i >> 3)); }
  function sqIdx(n) { return (8 - parseInt(n[1], 10)) * 8 + FILES.indexOf(n[0]); }

  function parse(fen) {
    var parts = fen.trim().split(/\s+/);
    var b = new Array(64).fill(null), i = 0;
    for (var k = 0; k < parts[0].length; k++) {
      var ch = parts[0][k];
      if (ch === '/') continue;
      if (/\d/.test(ch)) i += +ch; else b[i++] = ch;
    }
    var c = parts[2] || '-';
    return {
      b: b, t: parts[1] || 'w',
      c: { K: c.indexOf('K') >= 0, Q: c.indexOf('Q') >= 0, k: c.indexOf('k') >= 0, q: c.indexOf('q') >= 0 },
      ep: parts[3] && parts[3] !== '-' ? sqIdx(parts[3]) : -1,
      h: +(parts[4] || 0), n: +(parts[5] || 1)
    };
  }
  function fen(s) {
    var out = '';
    for (var r = 0; r < 8; r++) {
      var e = 0;
      for (var f = 0; f < 8; f++) {
        var p = s.b[r * 8 + f];
        if (!p) e++; else { if (e) { out += e; e = 0; } out += p; }
      }
      if (e) out += e;
      if (r < 7) out += '/';
    }
    var c = (s.c.K ? 'K' : '') + (s.c.Q ? 'Q' : '') + (s.c.k ? 'k' : '') + (s.c.q ? 'q' : '');
    return out + ' ' + s.t + ' ' + (c || '-') + ' ' + (s.ep >= 0 ? sqName(s.ep) : '-') + ' ' + s.h + ' ' + s.n;
  }
  function posKey(s) { return fen(s).split(' ').slice(0, 4).join(' '); }

  function attacked(b, sq, by) {
    var r = sq >> 3, f = sq & 7, i, rr, ff, p;
    var pr = by === 'w' ? r + 1 : r - 1, pawn = by === 'w' ? 'P' : 'p';
    if (pr >= 0 && pr < 8) {
      if (f > 0 && b[pr * 8 + f - 1] === pawn) return true;
      if (f < 7 && b[pr * 8 + f + 1] === pawn) return true;
    }
    var kn = by === 'w' ? 'N' : 'n', kg = by === 'w' ? 'K' : 'k';
    for (i = 0; i < 8; i++) {
      rr = r + KN[i][0]; ff = f + KN[i][1];
      if (on(rr, ff) && b[rr * 8 + ff] === kn) return true;
      rr = r + ALL8[i][0]; ff = f + ALL8[i][1];
      if (on(rr, ff) && b[rr * 8 + ff] === kg) return true;
    }
    var bq = by === 'w' ? 'BQ' : 'bq', rq = by === 'w' ? 'RQ' : 'rq';
    for (i = 0; i < 4; i++) {
      rr = r + DIAG[i][0]; ff = f + DIAG[i][1];
      while (on(rr, ff)) { p = b[rr * 8 + ff]; if (p) { if (bq.indexOf(p) >= 0) return true; break; } rr += DIAG[i][0]; ff += DIAG[i][1]; }
      rr = r + ORTH[i][0]; ff = f + ORTH[i][1];
      while (on(rr, ff)) { p = b[rr * 8 + ff]; if (p) { if (rq.indexOf(p) >= 0) return true; break; } rr += ORTH[i][0]; ff += ORTH[i][1]; }
    }
    return false;
  }
  function attackers(b, sq, by) { // list of squares of pieces of color `by` attacking sq
    var out = [];
    for (var i = 0; i < 64; i++) if (b[i] && col(b[i]) === by && attacksSq(b, i, sq)) out.push(i);
    return out;
  }
  function kingSq(b, c) { var k = c === 'w' ? 'K' : 'k'; for (var i = 0; i < 64; i++) if (b[i] === k) return i; return -1; }
  function inCheck(s) { var k = kingSq(s.b, s.t); return k >= 0 && attacked(s.b, k, opp(s.t)); }

  // squares attacked by the piece standing on sq
  function attacksFrom(b, sq) {
    var p = b[sq]; if (!p) return [];
    var t = typ(p), c = col(p), r = sq >> 3, f = sq & 7, out = [], i, rr, ff;
    if (t === 'p') {
      var d = c === 'w' ? -1 : 1;
      if (on(r + d, f - 1)) out.push((r + d) * 8 + f - 1);
      if (on(r + d, f + 1)) out.push((r + d) * 8 + f + 1);
    } else if (t === 'n' || t === 'k') {
      var set = t === 'n' ? KN : ALL8;
      for (i = 0; i < 8; i++) { rr = r + set[i][0]; ff = f + set[i][1]; if (on(rr, ff)) out.push(rr * 8 + ff); }
    } else {
      var dirs = t === 'b' ? DIAG : t === 'r' ? ORTH : ALL8;
      for (i = 0; i < dirs.length; i++) {
        rr = r + dirs[i][0]; ff = f + dirs[i][1];
        while (on(rr, ff)) { out.push(rr * 8 + ff); if (b[rr * 8 + ff]) break; rr += dirs[i][0]; ff += dirs[i][1]; }
      }
    }
    return out;
  }
  function attacksSq(b, from, sq) { return attacksFrom(b, from).indexOf(sq) >= 0; }

  function pseudo(s, capsOnly) {
    var b = s.b, us = s.t, them = opp(us), mv = [], i;
    for (var sq = 0; sq < 64; sq++) {
      var p = b[sq]; if (!p || col(p) !== us) continue;
      var t = typ(p), r = sq >> 3, f = sq & 7, rr, ff, to, q;
      if (t === 'p') {
        var d = us === 'w' ? -1 : 1, startR = us === 'w' ? 6 : 1, promR = us === 'w' ? 0 : 7;
        rr = r + d;
        if (rr >= 0 && rr < 8) {
          to = rr * 8 + f;
          if (!b[to] && (!capsOnly || rr === promR)) {
            if (rr === promR) ['q', 'r', 'b', 'n'].forEach(function (pp) { mv.push({ from: sq, to: to, p: p, promo: pp }); });
            else {
              mv.push({ from: sq, to: to, p: p });
              if (r === startR && !b[(r + 2 * d) * 8 + f]) mv.push({ from: sq, to: (r + 2 * d) * 8 + f, p: p, dbl: true });
            }
          }
          for (var df = -1; df <= 1; df += 2) {
            ff = f + df; if (ff < 0 || ff > 7) continue;
            to = rr * 8 + ff;
            if (b[to] && col(b[to]) === them) {
              if (rr === promR) ['q', 'r', 'b', 'n'].forEach(function (pp) { mv.push({ from: sq, to: to, p: p, cap: b[to], promo: pp }); });
              else mv.push({ from: sq, to: to, p: p, cap: b[to] });
            } else if (to === s.ep) mv.push({ from: sq, to: to, p: p, cap: us === 'w' ? 'p' : 'P', ep: true });
          }
        }
      } else if (t === 'n' || t === 'k') {
        var set = t === 'n' ? KN : ALL8;
        for (i = 0; i < 8; i++) {
          rr = r + set[i][0]; ff = f + set[i][1]; if (!on(rr, ff)) continue;
          to = rr * 8 + ff; q = b[to];

    if (!G && S.current) buildGame();
    if (!G || wantSetup) { renderSetup(el); return; }
    var opp = LV[G.c.level], lesson = G.c.focus ? LBY[G.c.focus] : null;
    el.innerHTML =
      '<div class="play-grid"><div>' +
        '<div class="player" id="pTop"></div>' +
        '<div class="board-frame"><div id="gboard"></div></div>' +
        '<div class="player" id="pBot"></div>' +
        '<div class="controls"><div class="grp">' +
          '<button class="iconbtn" id="bFlip" title="Flip board">' + icon('flip') + '</button>' +
          '<button class="iconbtn" id="bUndo" title="Take back">' + icon('undo') + '</button>' +
          '<button class="iconbtn" id="bHint" title="Hint">' + icon('bulb') + '</button>' +
        '</div><div class="grp"><button class="btn sm ghost" id="bResign">' + icon('flag').replace('<svg>', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5">') + 'Resign</button><button class="btn sm" id="bNew">New game</button></div></div>' +
      '</div>' +
      '<div class="play-side">' +
        '<div class="panel"><div class="panel-h"><div><div class="eyebrow">Coach</div><div class="focus-name" style="margin-top:2px">' + (lesson ? h(lesson.name) : 'Open game') + '</div></div>' +
          '<span class="toggle ' + (G.c.hints ? 'on' : '') + '" id="tHints"><span>Hints</span><span class="sw"></span></span></div>' +
          '<div class="panel-b"><div class="checks" id="checks"></div>' +
          '<div class="opp" id="opp"><div class="t" id="oppT"></div><div class="a"><button class="btn sm brass" id="oppShow">Show piece</button></div></div>' +
          '<ul class="log" id="log"></ul></div></div>' +
        '<div class="panel"><div class="panel-h"><div class="eyebrow">Moves</div><div class="muted" style="font-size:12px">' + (G.c.casual ? 'Unrated' : 'Rated · ' + opp.rating) + '</div></div><div class="panel-b"><div class="moves" id="moves"></div></div></div>' +
        '<!-- AD SLOT: play sidebar medium rectangle 300x250 --><div class="ad ad-rect side-ad" data-ad-slot="play-sidebar"><span class="dim">300 × 250</span></div>' +
      '</div></div>';
    playBoard = new Board($('#gboard', el), gameClick);
    playBoard.flip = G.c.color === 'b';
    $('#bFlip', el).onclick = function () { playBoard.flip = !playBoard.flip; drawGame(); };
    $('#bUndo', el).onclick = takeback;
    $('#bHint', el).onclick = function () { if (!G.c.hints) { G.c.hints = true; S.settings.hints = true; save(); $('#tHints').classList.add('on'); } showOpp(true); };
    $('#bResign', el).onclick = function () { if (G.over) return; confirmBox('Resign this game?', G.c.casual ? 'This game is unrated.' : 'It counts as a loss against ' + opp.name + '.', 'Resign', function () { finishGame('L', 'resignation'); }); };
    $('#bNew', el).onclick = function () {
      if (!G.over && userMoveCount() > 0) confirmBox('Start a new game?', 'Your current game will be resigned.', 'Resign and continue', function () { finishGame('L', 'resignation', true); wantSetup = true; renderPlay(el); });
      else { wantSetup = true; renderPlay(el); }
    };
    $('#tHints', el).onclick = function () { G.c.hints = !G.c.hints; S.settings.hints = G.c.hints; save(); this.classList.toggle('on', G.c.hints); G.hintSq = G.hintSq2 = null; drawGame(); };
    $('#oppShow', el).onclick = function () { showOpp(true); };
    renderLog();
    if (!G.over) { if (G.s.t !== userColor()) aiTurn(); else userTurn(); } else drawGame();
  }
  function showOpp(force) {
    var keys = Object.keys(G.opps);
    if (!keys.length) { if (force) toast('No tactic on the board. Improve your worst piece.'); return; }
    var focusT = G.c.focus && LBY[G.c.focus].tech, k = G.opps[focusT] ? focusT : keys[0], o = G.opps[k];
    if (G.hintSq === o.from) G.hintSq2 = o.to; else G.hintSq = o.from;
    drawGame();
  }
  function takeback() {
    if (G.thinking || G.hist.length < 2) return;
    if (G.over) return;
    var n = G.s.t === userColor() ? 2 : 1;
    if (G.hist.length - 1 < n) n = G.hist.length - 1;
    for (var i = 0; i < n; i++) {
      var k = ENG.posKey(G.s); G.keys[k]--;
      G.hist.pop(); G.c.moves.pop(); G.s = G.hist[G.hist.length - 1].s;
    }
    if (G.s.t !== userColor()) { aiTurn(); return; }
    if (!G.c.casual) { G.c.casual = true; logMsg('note', 'Takeback', 'Takebacks make this game unrated.'); }
    G.sel = null; save(); userTurn();
  }
  function gameClick(sq) {
    if (!G || G.over || G.thinking || G.s.t !== userColor()) return;
    var p = G.s.b[sq];
    if (G.sel === null || (p && ENG.col(p) === userColor())) {
      G.sel = (p && ENG.col(p) === userColor() && G.sel !== sq) ? sq : null; drawGame(); return;
    }
    var cand = ENG.legal(G.s).filter(function (m) { return m.from === G.sel && m.to === sq; });
    if (!cand.length) { G.sel = null; drawGame(); return; }
    if (cand.length > 1) { promoPick(cand); return; }
    playUserMove(cand[0]);
  }
  function promoPick(cand) {
    var us = userColor();
    openModal('<div class="eyebrow">Promote to</div><div class="promo">' + ['q', 'r', 'b', 'n'].map(function (t) {
      return '<button data-p="' + t + '">' + pieceSvg(us === 'w' ? t.toUpperCase() : t) + '</button>'; }).join('') + '</div>');
    $$('.promo button').forEach(function (b) { b.onclick = function () { closeModal(); playUserMove(cand.find(function (m) { return m.promo === b.dataset.p; })); }; });
  }
  function capturedBy(color) { // pieces captured by `color`
    var start = { p: 8, n: 2, b: 2, r: 2, q: 1 }, cnt = { p: 0, n: 0, b: 0, r: 0, q: 0 }, them = color === 'w' ? 'b' : 'w';
    G.s.b.forEach(function (p) { if (p && ENG.col(p) === them && cnt[ENG.typ(p)] !== undefined) cnt[ENG.typ(p)]++; });
    if (G.c.fen0 !== ENG.START) return '';
    var out = '';
    ['q', 'r', 'b', 'n', 'p'].forEach(function (t) { for (var i = 0; i < Math.max(0, start[t] - cnt[t]); i++) out += pieceSvg(them === 'w' ? t.toUpperCase() : t); });
    return out;
  }
  function drawGame() {
    if (!playBoard || !$('#gboard')) return;
    var us = userColor(), last = lastMove();
    var t = G.sel !== null ? ENG.legal(G.s).filter(function (m) { return m.from === G.sel; }).map(function (m) { return m.to; }) : null;
    playBoard.render(G.s, { last: last, sel: G.sel, targets: t, hint: G.hintSq, hint2: G.hintSq2 });
    var opp = LV[G.c.level], them = us === 'w' ? 'b' : 'w';
    var top = playBoard.flip === (us === 'b') ? 'opp' : 'me';
    var oppHtml = '<div class="who"><span class="av">' + pieceSvg(them === 'w' ? 'K' : 'k') + '</span><div><div class="nm">' + opp.name + ' <span class="muted" style="font-size:12px">· Level ' + ROMAN[G.c.level] + '</span></div><div class="rt num">' + opp.rating + '</div></div></div><div style="text-align:right"><div class="thinking ' + (G.thinking ? 'on' : '') + '">Thinking<i></i><i></i><i></i></div><div class="capt">' + capturedBy(them) + '</div></div>';
    var meHtml = '<div class="who"><span class="av">' + pieceSvg(us === 'w' ? 'K' : 'k') + '</span><div><div class="nm">You</div><div class="rt num">' + S.rating + '</div></div></div><div class="capt">' + capturedBy(us) + '</div>';
    $('#pTop').innerHTML = top === 'opp' ? oppHtml : meHtml;
    $('#pBot').innerHTML = top === 'opp' ? meHtml : oppHtml;
    // moves
    var mv = '', ms = G.hist.slice(1), startBlack = G.hist[0].s.t === 'b', moveNo = G.hist[0].s.n;
    var list = startBlack ? [null].concat(ms) : ms;
    for (var i = 0; i < list.length; i += 2) {
      mv += '<span class="n">' + (moveNo + i / 2) + '.</span><span' + (list[i] && i === list.length - 1 ? ' class="cur"' : '') + '>' + (list[i] ? h(list[i].san) : '…') + '</span><span' + (i + 1 === list.length - 1 ? ' class="cur"' : '') + '>' + (list[i + 1] ? h(list[i + 1].san) : '') + '</span>';
    }
    var me = $('#moves'); me.innerHTML = mv || '<span class="n" style="grid-column:1/-1">No moves yet</span>'; me.scrollTop = me.scrollHeight;
    // checklist
    var ck = '';
    if (G.c.fen0 === ENG.START) {
      var f = G.c.flags;
      ck = '<span class="' + (f.center ? 'ok' : '') + '">Center</span><span class="' + (f.develop ? 'ok' : '') + '">Development ' + Math.min(4, G.c.dev.length) + '/4</span><span class="' + (f.castle ? 'ok' : '') + '">Castled</span>';
    } else ck = '<span>Goal: checkmate within 50 moves</span><span class="num">Move ' + (userMoveCount()) + '</span>';
    $('#checks').innerHTML = ck;
    // opportunity
    var box = $('#opp'), keys = Object.keys(G.opps || {});
    if (G.c.hints && keys.length && !G.over && G.s.t === us && !G.thinking) {
      var focusT = G.c.focus && LBY[G.c.focus].tech, k = G.opps[focusT] ? focusT : keys[0];
      $('#oppT').innerHTML = '<b style="color:var(--brass)">Opportunity.</b> ' + (k === 'backrank' ? 'There is a back-rank checkmate.' : 'A ' + TECH[k].toLowerCase() + ' is on the board.') + ' Find it.';
      $('#oppShow').textContent = G.hintSq === G.opps[k].from ? 'Show square' : 'Show piece';
      box.classList.add('on');
    } else box.classList.remove('on');
    $('#bUndo').disabled = G.over || G.hist.length < 2;
  }
  function renderLog() {
    var l = $('#log'); if (!l || !G) return;
    l.innerHTML = G.c.log.slice(0, 12).map(function (x) { return '<li class="' + x.k + '"><span class="tg">' + h(x.t) + '</span><span>' + x.x + '</span></li>'; }).join('');
  }

  function renderSetup(el) {
    var st = S.settings, sel = { level: st.level, color: st.color, focus: st.focus, hints: st.hints };
    el.innerHTML =
      '<div class="setup"><div class="eyebrow">New game</div><h1 class="display" style="margin:6px 0 30px">Choose your opponent</h1>' +
      '<div class="eyebrow">Opponent</div><div class="levels">' + LV.map(function (l, i) {
        var e = expected(S.rating, l.rating), gain = Math.round((S.games.length < 10 ? 40 : 24) * (1 - e));
        return '<button class="lvl" data-l="' + i + '"><div class="rn">' + ROMAN[i] + '</div><div class="nm">' + l.name + '</div><div class="rt num">' + l.rating + ' · win +' + gain + '</div></button>'; }).join('') + '</div>' +
      '<div class="eyebrow">Play as</div><div class="seg" id="sc"><button data-c="w">White</button><button data-c="b">Black</button><button data-c="r">Random</button></div>' +
      '<div class="eyebrow">Practice focus</div><select class="sel" id="sf"><option value="">Open game · all techniques</option>' +
        LESSONS.map(function (l) { return '<option value="' + l.id + '">' + h(l.name) + (l.practice.fen ? ' · special position' : '') + '</option>'; }).join('') + '</select>' +
      '<div><span class="toggle" id="sh"><span class="sw"></span><span>Coach hints during play</span></span></div>' +
      '<div style="margin-top:34px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn brass" id="go">Begin game</button>' + (G && !G.over ? '<button class="btn ghost" id="cancel">Back to game</button>' : (G ? '<button class="btn ghost" id="cancel">Review last game</button>' : '')) + '</div></div>';
    function paint() {
      $$('.lvl', el).forEach(function (b) { b.classList.toggle('on', +b.dataset.l === sel.level); });
      $$('#sc button', el).forEach(function (b) { b.classList.toggle('on', b.dataset.c === sel.color); });
      $('#sf', el).value = sel.focus; $('#sh', el).classList.toggle('on', sel.hints);
    }
    $$('.lvl', el).forEach(function (b) { b.onclick = function () { sel.level = +b.dataset.l; paint(); }; });
    $$('#sc button', el).forEach(function (b) { b.onclick = function () { sel.color = b.dataset.c; paint(); }; });
    $('#sf', el).onchange = function () { sel.focus = this.value; };
    $('#sh', el).onclick = function () { sel.hints = !sel.hints; paint(); };
    $('#go', el).onclick = function () {
      S.settings.level = sel.level; S.settings.color = sel.color; S.settings.focus = sel.focus; S.settings.hints = sel.hints;
      wantSetup = false; startGame({ level: sel.level, color: sel.color, focus: sel.focus, hints: sel.hints, fen: sel.focus && LBY[sel.focus].practice.fen });
      renderPlay(el);
    };
    var c = $('#cancel', el); if (c) c.onclick = function () { wantSetup = false; renderPlay(el); };
    paint();
  }

  /* ================= Progress ================= */
  function chartSvg() {
    var pts = S.hist.slice(-80), W = 720, H = 240, pl = 44, pr = 14, pt = 16, pb = 28;
    var vals = pts.map(function (x) { return x.r; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    min = Math.floor((min - 40) / 50) * 50; max = Math.ceil((max + 40) / 50) * 50;
    var X = function (i) { return pl + (pts.length < 2 ? (W - pl - pr) / 2 : i / (pts.length - 1) * (W - pl - pr)); };
    var Y = function (v) { return pt + (1 - (v - min) / (max - min)) * (H - pt - pb); };
    var g = '';
    var step = (max - min) / 4;
    for (var i = 0; i <= 4; i++) { var v = Math.round(min + step * i), y = Y(v); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#25252a"/><text x="' + (pl - 10) + '" y="' + (y + 3) + '" text-anchor="end">' + v + '</text>'; }
    TIERS.forEach(function (t) { if (t.r > min && t.r < max) { var y = Y(t.r); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#b89a62" stroke-opacity=".35" stroke-dasharray="3 5"/><text x="' + (W - pr) + '" y="' + (y - 5) + '" text-anchor="end" style="fill:#b89a62">' + t.n.toUpperCase() + '</text>'; } });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.r).toFixed(1); }).join(' ');
    if (pts.length < 2) line = 'M' + pl + ' ' + Y(vals[0]) + ' L' + (W - pr) + ' ' + Y(vals[0]);
    var area = line + ' L' + X(Math.max(pts.length - 1, 0)).toFixed(1) + ' ' + (H - pb) + ' L' + pl + ' ' + (H - pb) + ' Z';
    var fmt = function (d) { var x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate(); };
    var lx = X(pts.length - 1), ly = Y(vals[vals.length - 1]);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b89a62" stop-opacity=".22"/><stop offset="1" stop-color="#b89a62" stop-opacity="0"/></linearGradient></defs>' + g +
      (pts.length > 1 ? '<path d="' + area + '" fill="url(#ga)"/>' : '') + '<path d="' + line + '" fill="none" stroke="#d8bd86" stroke-width="1.6"/>' +
      '<circle cx="' + lx + '" cy="' + ly + '" r="4" fill="#0b0b0c" stroke="#d8bd86" stroke-width="1.6"/>' +
      '<text x="' + pl + '" y="' + (H - 8) + '">' + fmt(pts[0].d) + '</text><text x="' + (W - pr) + '" y="' + (H - 8) + '" text-anchor="end">' + (pts.length > 1 ? 'NOW' : '') + '</text></svg>';
  }
  function renderProgress(el) {
    var rec = record(), vis = overallVision(), dt = drillTotals(), t = tierOf(S.rating), nt = nextTier(S.rating);
    var winRate = rec.n ? Math.round(100 * (rec.w + rec.d / 2) / rec.n) : null;
    var techRows = Object.keys(TECH).map(function (k) {
      var x = S.tech[k], v = TACTICS.indexOf(k) >= 0 ? vision(k) : null;
      return '<tr><td>' + TECH[k] + '</td><td class="r num">' + x.done + '</td><td class="r num hide-m">' + (TACTICS.indexOf(k) >= 0 ? x.missed : '·') + '</td><td class="r vis">' +
        (v === null ? '<span class="muted" style="font-size:12px">' + (TACTICS.indexOf(k) >= 0 ? 'No data' : 'Tracked') + '</span>' : '<div class="mrow" style="margin:0 0 6px;justify-content:flex-end"><span class="num">' + v + '%</span></div><div class="bar"><i style="width:' + v + '%"></i></div>') + '</td></tr>';
    }).join('');
    var games = S.games.slice(-8).reverse().map(function (g) {
      var dd = new Date(g.d);
      return '<tr><td><span class="res ' + g.res + '">' + g.res + '</span></td><td>' + LV[g.lvl].name + '<div class="muted" style="font-size:12px">' + (g.focus ? h(LBY[g.focus].name) : 'Open game') + ' · ' + Math.ceil(g.plies / 2) + ' moves</div></td><td class="r muted hide-m" style="font-size:12px">' + (dd.getMonth() + 1) + '/' + dd.getDate() + '</td><td class="r num ' + (g.delta > 0 ? 'pos' : g.delta < 0 ? 'neg' : 'muted') + '">' + (g.rated ? (g.delta > 0 ? '+' : '') + g.delta : 'Unrated') + '</td></tr>';
    }).join('');
    var lessonRows = LESSONS.map(function (l) { var m = mastery(l); return '<div class="mrow"><span>' + h(l.name) + '</span><span class="num ' + (m.pct === 100 ? '' : 'muted') + '" style="' + (m.pct === 100 ? 'color:var(--brass)' : '') + '">' + (m.pct === 100 ? 'Mastered' : m.pct + '%') + '</span></div><div class="bar"><i style="width:' + m.pct + '%"></i></div>'; }).join('');
    el.innerHTML =
      '<div class="section-h"><div><div class="eyebrow">Progress</div><h1 class="display" style="margin-top:6px">The long game.</h1></div></div>' +
      '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px"><div><div class="eyebrow brass">Rating</div><div style="font-family:var(--serif);font-size:60px;line-height:1;margin-top:8px" class="num">' + S.rating + '</div></div>' +
        '<div style="text-align:right"><div class="muted" style="font-size:12px;letter-spacing:.1em">PEAK <span class="num" style="color:var(--ink)">' + S.peak + '</span></div><div class="muted" style="font-size:12px;letter-spacing:.1em;margin-top:4px">' + (nt ? (nt.r - S.rating) + ' TO ' + nt.n.toUpperCase() : 'TOP TIER') + '</div></div></div>' +
        chartSvg() +
        '<div class="ladder">' + TIERS.map(function (x) { return '<div class="t ' + (x === t ? 'cur' : S.rating >= x.r ? 'got' : '') + '">' + pieceSvg(x.p.toUpperCase()) + '<div class="n">' + x.n + '</div><div class="r num">' + x.r + '+</div></div>'; }).join('') + '</div>' +
      '</div>' +
      '<div class="grid g4" style="margin-top:20px">' +
        statCard('Win rate', winRate === null ? NONE : winRate + '%', rec.n ? rec.w + 'W ' + rec.d + 'D ' + rec.l + 'L' : '') +
        statCard('Tactical vision', vis === null ? NONE : vis + '%', '') +
        statCard('Drills', dt.solved + '<small>/ ' + dt.all + '</small>', '') +
        statCard('Streak', streak(), streak() === 1 ? 'day' : 'days') +
      '</div>' +
      '<div class="grid g2" style="margin-top:20px">' +
        '<div class="card"><div class="eyebrow" style="margin-bottom:6px">Techniques in games</div><p class="muted" style="font-size:12.5px;margin-bottom:16px">Vision is the share of tactical chances you took.</p><table class="tt"><thead><tr><th>Technique</th><th class="r">Done</th><th class="r hide-m">Missed</th><th class="r">Vision</th></tr></thead><tbody>' + techRows + '</tbody></table></div>' +
        '<div class="card"><div class="eyebrow" style="margin-bottom:6px">Lesson mastery</div>' + lessonRows + '</div>' +
      '</div>' +
      '<div class="grid g2" style="margin-top:20px;align-items:start">' +
        '<div class="card"><div class="eyebrow" style="margin-bottom:12px">Recent games</div>' + (games ? '<table class="tt"><tbody>' + games + '</tbody></table>' : '<div class="empty">No games yet. <a href="#play" style="color:var(--brass)">Play your first.</a></div>') + '</div>' +
        '<div><!-- AD SLOT: progress page medium rectangle 300x250 --><div class="ad ad-rect" data-ad-slot="progress-rect"><span class="dim">300 × 250</span></div>' +
        '<div style="text-align:center;margin-top:18px"><button class="btn sm ghost" id="reset">Reset progress</button></div></div>' +
      '</div>';
    $('#reset', el).onclick = function () { confirmBox('Reset all progress?', 'Your rating, games, drills and technique history will be erased.', 'Reset', function () { S = fresh(); G = null; save(); bindHeader(); route(); }); };
  }

  /* ================= Boot ================= */
  bindHeader(); adsize();
  window.addEventListener('resize', adsize);
  if (!location.hash) location.hash = 'home';
  route();
  setTimeout(connect, 0);
})();

</script>
<script src="ads.bundle.js"></script>
</body>
</html>
